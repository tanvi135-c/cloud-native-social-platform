services:

  postgres:
    image: postgres:16
    container_name: social-platform-db

    environment:
      POSTGRES_DB: social_platform
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social_platform"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: social-platform-backend

    environment:
      DATABASE_URL: postgresql://social_user:social_password@postgres:5432/social_platform

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    container_name: social-platform-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend        


volumes:
  postgres_data: